services:
  mcp-neo4j:
    image: mcp/neo4j
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_TRANSPORT_MODE: http
      NEO4J_MCP_HTTP_HOST: "0.0.0.0"
      NEO4J_MCP_HTTP_PORT: "8080"
      NEO4J_TELEMETRY: "false"
      NEO4J_READONLY: "true"
    ports:
      - "8081:8080"
    depends_on:
      - neo4j
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "7476:7474"   # Browser
      - "7688:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_bolt_advertised__address: "localhost:7688"
      NEO4J_server_http_advertised__address: "localhost:7476"
      NEO4J_dbms_routing_enabled: "false"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6335:6333"   # REST
      - "6336:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: aquila
      POSTGRES_PASSWORD: aquila
      POSTGRES_DB: aquila
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  qdrant_data:
  postgres_data:
