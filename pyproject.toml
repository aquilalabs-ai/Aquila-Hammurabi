[project]
name = "aquila-hammurabi"
version = "0.1.0"
description = "The Law, Decoded."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Ingestion — source connectors
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "lxml>=5.0",
    "httpx>=0.27",
    # Ingestion — chunker
    "tiktoken>=0.7",
    # Knowledge — graph + vector
    "neo4j>=5.0",
    "qdrant-client>=1.9",
]

[project.optional-dependencies]
# NER acceleration — install when a compatible spaCy wheel is available:
#   pip install "aquila-hammurabi[ner]"
#   python -m spacy download fr_core_news_lg
ner = [
    "spacy>=3.7",
]

[project.scripts]
hammurabi = "main:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hammurabi"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["hammurabi"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
